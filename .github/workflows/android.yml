name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets this build can see (names only)
        env:
          ALL: ${{ toJSON(secrets) }}
        run: echo "$ALL" | jq -r 'keys[] | "  - " + .'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Compile (debug)
        working-directory: android
        run: |
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log | grep -E "^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)" ; test ${PIPESTATUS[0]} -eq 0

      - name: Tests (form filling, backups)
        working-directory: android
        run: |
          gradle :app:testDebugUnitTest 2>&1 | tee test.log | grep -E "FAILED|tests completed|BUILD (SUCCESSFUL|FAILED)|Test.*>" ; test ${PIPESTATUS[0]} -eq 0
          grep -ho '<testsuite [^>]*' app/build/test-results/testDebugUnitTest/*.xml | grep -o 'name="[^"]*"\|tests="[0-9]*"\|failures="[0-9]*"\|errors="[0-9]*"' | paste -sd' '

      - name: Check release build (no signing key yet)
        if: env.ANDROID_KEY_PASSWORD == ''
        working-directory: android
        run: |
          gradle :app:assembleRelease 2>&1 | tee release.log | grep -E "^e: |error:|Error|FAILED|BUILD (SUCCESSFUL|FAILED)" ; test ${PIPESTATUS[0]} -eq 0
          ls -la app/build/outputs/apk/release/

      # One-time: create the signing key, encrypted with the passphrase in the ANDROID_KEY_PASSWORD secret,
      # and commit only the encrypted file. Every later build reuses it, so installed copies can update.
      - name: Signing key
        id: key
        if: env.ANDROID_KEY_PASSWORD != ''
        working-directory: android
        run: |
          if [ ${#ANDROID_KEY_PASSWORD} -lt 12 ]; then echo "::error::ANDROID_KEY_PASSWORD must be at least 12 characters"; exit 1; fi
          if [ ! -f signing/release.p12.enc ]; then
            keytool -genkeypair -storetype PKCS12 -keystore signing/release.p12 -alias fieldbook \
              -keyalg RSA -keysize 4096 -validity 36500 -storepass "$ANDROID_KEY_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=FTO FieldBook, O=mosurabeats, C=US"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in signing/release.p12 -out signing/release.p12.enc -pass env:ANDROID_KEY_PASSWORD
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add signing/release.p12.enc
            git commit -m "Android signing key (encrypted)"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/release.p12.enc -out signing/release.p12 -pass env:ANDROID_KEY_PASSWORD \
              || { echo "::error::ANDROID_KEY_PASSWORD doesn't match the saved signing key"; exit 1; }
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Release APK + Play bundle
        if: steps.key.outputs.ok == 'true'
        working-directory: android
        run: |
          gradle :app:assembleRelease :app:bundleRelease 2>&1 | tee release.log | grep -E "^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)" ; test ${PIPESTATUS[0]} -eq 0
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/FieldBook.apk
          cp app/build/outputs/bundle/release/app-release.aab ../out/FieldBook.aab
          rm -f signing/release.p12

      - name: Publish download
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="FieldBook for Android, build ${{ github.run_number }}. Install FieldBook.apk on the phone; FieldBook.aab is for Google Play."
          gh release view android >/dev/null 2>&1 || gh release create android --title "FieldBook for Android" --notes "$NOTES" --target main
          gh release edit android --notes "$NOTES"
          gh release upload android out/FieldBook.apk out/FieldBook.aab --clobber

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logs
          path: |
            android/build.log
            android/release.log
            android/test.log
            android/app/build/reports/
          if-no-files-found: ignore
