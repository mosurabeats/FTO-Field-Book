name: FieldBook
options:
  bundleIdPrefix: com.mosurabeats
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  FieldBook:
    type: application
    platform: iOS
    sources:
      - path: FieldBook
    dependencies:
      - package: ZIPFoundation
    info:
      path: FieldBook/Info.plist
      properties:
        CFBundleDisplayName: FieldBook
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
        NSFaceIDUsageDescription: Unlock FieldBook to view trainee records.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mosurabeats.fieldbook
        PRODUCT_NAME: FieldBook
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
