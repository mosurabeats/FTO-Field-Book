<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2F3943">
<meta name="apple-mobile-web-app-title" content="10-8">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>10-8</title>
<script>try{var m=localStorage.getItem('fto_theme')||'auto';if(m==='dark')m='night';var t=m==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'night':'light'):m;document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root,[data-theme=light]{
  --bg:#E7E7E1;--p1:#F4F4EF;--p2:#E0E1DB;--p3:#D3D6D2;--line:#C3C9CC;--tx:#2F3943;--tx2:#3C4753;--mu:#4E5C6A;--dim:#68747F;
  --acc:#33658C;--acc2:#33658C;--acctx:#FFFFFF;--accsoft:rgba(51,101,140,.12);--pos:#2E7D4F;--possoft:rgba(46,125,79,.12);--neg:#C42A30;--negsoft:rgba(232,52,59,.11);--neu:#8A96A2;--blue:#33658C;
  --hdr:#4E5C6A;--hdrtx:#E7E7E1;--hdrmu:#D5DCE2;--tabbg:rgba(244,244,239,.97);
  --rlo:#C42A30;--rlo-bg:rgba(232,52,59,.13);--rmid:#935700;--rmid-bg:rgba(200,120,0,.14);--rok:#2F3943;--rok-bg:#DCDFDB;--rhi:#2E7D4F;--rhi-bg:rgba(46,125,79,.13);
  --aibg:linear-gradient(135deg,#E1EDF6,#D8E6F1);--ailine:#A9C4DA;--aitx:#23507A;--card-shadow:0 1px 2px rgba(47,57,67,.08);
  --sp-mid:#33658C;--sp-axis:#BFC6CB;--sp-dot:#4E5C6A;--secondary:#7FA6C6;
  --hi:#D42A31;--hitx:#FFFFFF;--hi2:#B8242B;--hisoft:rgba(212,42,49,.09);--ring:#E7E7E1;
  color-scheme:light;
  --r:14px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--stripes:linear-gradient(90deg,#33658C 0 25%,#39B4F2 25% 50%,#E7E7E1 50% 75%,#E8343B 75% 100%);
}
[data-theme=slate]{
  --bg:#4E5C6A;--p1:#3C4753;--p2:#2F3943;--p3:#46525F;--line:#5B6876;--tx:#E7E7E1;--tx2:#D7DCE1;--mu:#CDD5DC;--dim:#A7B1BC;
  --acc:#39B4F2;--acc2:#8FD6F8;--acctx:#0E1D28;--accsoft:rgba(57,180,242,.16);--pos:#8EE3A8;--possoft:rgba(142,227,168,.14);--neg:#FF9EA2;--negsoft:rgba(232,52,59,.24);--neu:#A7B1BC;--blue:#39B4F2;
  --hdr:#2F3943;--hdrtx:#E7E7E1;--hdrmu:#C3CCD4;--tabbg:rgba(47,57,67,.97);
  --rlo:#FFB4B7;--rlo-bg:rgba(232,52,59,.32);--rmid:#FFD08A;--rmid-bg:rgba(255,170,60,.22);--rok:#E7E7E1;--rok-bg:#4A5664;--rhi:#A9F0BF;--rhi-bg:rgba(80,200,120,.24);
  --aibg:linear-gradient(135deg,#33658C,#2C5878);--ailine:#4C82AD;--aitx:#EAF6FF;--card-shadow:none;
  --sp-mid:#39B4F2;--sp-axis:#6A7785;--sp-dot:#E7E7E1;--secondary:#33658C;
  --hi:#D42A31;--hitx:#FFFFFF;--hi2:#8FD6F8;--hisoft:rgba(57,180,242,.15);--ring:#E7E7E1;
  color-scheme:dark;
}
[data-theme=night]{
  --bg:#1B222A;--p1:#232B34;--p2:#161C23;--p3:#2C3540;--line:#333D48;--tx:#E7E7E1;--tx2:#D7DCE1;--mu:#B4BEC8;--dim:#8792A0;
  --acc:#39B4F2;--acc2:#8FD6F8;--acctx:#0E1D28;--accsoft:rgba(57,180,242,.16);--pos:#8EE3A8;--possoft:rgba(142,227,168,.14);--neg:#FF9EA2;--negsoft:rgba(232,52,59,.24);--neu:#A7B1BC;--blue:#39B4F2;
  --hdr:#12171D;--hdrtx:#E7E7E1;--hdrmu:#C3CCD4;--tabbg:rgba(27,34,42,.97);
  --rlo:#FFB4B7;--rlo-bg:rgba(232,52,59,.32);--rmid:#FFD08A;--rmid-bg:rgba(255,170,60,.22);--rok:#E7E7E1;--rok-bg:#2C3540;--rhi:#A9F0BF;--rhi-bg:rgba(80,200,120,.24);
  --aibg:linear-gradient(135deg,#33658C,#2C5878);--ailine:#4C82AD;--aitx:#EAF6FF;--card-shadow:none;
  --sp-mid:#39B4F2;--sp-axis:#3F4A57;--sp-dot:#E7E7E1;--secondary:#33658C;
  --hi:#D42A31;--hitx:#FFFFFF;--hi2:#8FD6F8;--hisoft:rgba(57,180,242,.15);--ring:#E7E7E1;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif}
body{padding-bottom:calc(74px + var(--safe-b));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);color:var(--hdrtx);padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:11px}
.badge{width:36px;height:36px;flex:none;display:block}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-family:Archivo,Inter,sans-serif;font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{color:var(--hdrmu);font-size:12px}
.sync{font-size:11px;color:var(--hdrmu);display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#7F93B8}
.dot.ok{background:#3CCB8F}.dot.err{background:#FF7A6E}.dot.wait{background:#F0B54A}
header.top::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:4px;background:var(--stripes)}
main{padding:18px 14px 30px;max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--tabbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mu);font-size:10.5px;font-weight:600;border-radius:10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--hi2)}
nav.tabs button.on svg{filter:drop-shadow(0 0 0 transparent)}
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--card-shadow)}
.card h3{margin:0 0 10px;font-family:Archivo,Inter,sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
textarea,input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;font-size:16px;color:var(--tx)}
textarea::placeholder,input::placeholder{color:var(--dim)}
textarea:focus,input:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:90px}
label.f{display:block;font-size:12px;color:var(--mu);margin:10px 0 5px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 15px;border-radius:11px;background:var(--p3);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;color:var(--tx)}
.btn.pri{background:var(--hi);color:var(--hitx);border-color:var(--hi);font-family:Archivo,Inter,sans-serif;letter-spacing:.2px}
.btn.ai{background:var(--aibg);border-color:var(--ailine);color:var(--aitx)}
.btn.dng{color:var(--neg)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.seg{display:flex;background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--p1);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button.on.pos{background:var(--possoft);color:var(--pos);box-shadow:none}
.seg button.on.neg{background:var(--negsoft);color:var(--neg);box-shadow:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 10px;border-radius:20px;background:var(--p2);border:1px solid var(--line);font-size:12.5px;color:var(--mu);font-weight:500}
.chip.on{border-color:var(--hi);color:var(--hi2);background:var(--hisoft);font-weight:600}
.catbtn{width:100%;text-align:left;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;gap:8px;align-items:center;color:var(--tx)}
.catbtn .n{font-family:"IBM Plex Mono";font-size:12px;color:var(--hi2);min-width:22px}
.muted{color:var(--mu)}.small{font-size:12.5px}
.daygrp{margin:18px 2px 8px;font-family:Archivo,Inter,sans-serif;font-size:12px;font-weight:700;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
.note{display:flex;gap:10px;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;text-align:left;width:100%;color:var(--tx);box-shadow:var(--card-shadow)}
.note .bar{width:4px;border-radius:3px;background:var(--neu);flex:none}
.note.pos .bar{background:var(--pos)}.note.neg .bar{background:var(--neg)}
.note .meta{font-size:11.5px;color:var(--mu);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.note .meta .c{color:var(--acc2);font-weight:600}
.note .tx{white-space:pre-wrap;word-break:break-word}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.pill{display:inline-grid;place-items:center;min-width:38px;height:30px;padding:0 6px;border-radius:8px;font-family:"IBM Plex Mono";font-weight:700;font-size:14px;background:var(--p3);color:var(--mu)}
.r-lo{background:var(--rlo-bg);color:var(--rlo)}
.r-mid{background:var(--rmid-bg);color:var(--rmid)}
.r-ok{background:var(--rok-bg);color:var(--rok)}
.r-hi{background:var(--rhi-bg);color:var(--rhi)}
.r-no{background:var(--p2);color:var(--dim);font-size:12px}
.r-nrt{background:var(--negsoft);color:var(--neg);border:1.5px solid var(--neg);font-size:12px}
.grp{font-family:Archivo,Inter,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--hi2);margin:16px 2px 6px}
.cat{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--tx)}
.cat:last-child{border-bottom:0}
.cat .nm{flex:1;min-width:0}
.cat .nm b{font-weight:500;font-size:14px;display:block}
.cat .nm span{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .num{font-family:"IBM Plex Mono";font-size:11.5px;color:var(--dim);width:20px}
.flag{font-size:10.5px;font-weight:700;color:var(--hitx);background:var(--hi);border-radius:5px;padding:1px 5px;margin-left:4px}
.flag.red{background:var(--neg);color:#fff}
.flag.blue{background:var(--blue);color:var(--acctx)}
.sheetbg{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:50;opacity:0;transition:opacity .2s}
.sheetbg.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--p1);border-top:1px solid var(--line);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;padding:8px 16px calc(18px + var(--safe-b));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto;-webkit-overflow-scrolling:touch;color:var(--tx)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 4px;font-family:Archivo,Inter,sans-serif;font-size:18px}
.rgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 6px}
.rgrid button{height:46px;border-radius:10px;border:1px solid var(--line);font-family:"IBM Plex Mono";font-weight:700;font-size:17px}
.rgrid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.rgrid2 button{height:40px;border-radius:10px;background:var(--p2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--tx)}
.rgrid button.on,.rgrid2 button.on{outline:2.5px solid var(--hi);outline-offset:1px}
.anchor{border-left:3px solid var(--line);padding:6px 10px;margin:6px 0;font-size:13px;color:var(--tx2);background:var(--p2);border-radius:0 8px 8px 0}
.anchor b{font-family:"IBM Plex Mono";margin-right:6px}
.anchor.a1{border-color:var(--neg)}.anchor.a4{border-color:var(--neu)}.anchor.a7{border-color:var(--pos)}
details summary{cursor:pointer;color:var(--mu);font-size:13px;font-weight:600;padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--hdr);color:#fff;padding:10px 16px;border-radius:12px;z-index:80;opacity:0;transition:.2s;font-size:14px;max-width:90vw;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translateX(-50%)}
.statbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--card-shadow)}
.stat b{display:block;font-size:22px;font-family:"IBM Plex Mono"}
.stat span{font-size:11.5px;color:var(--mu)}
.trend{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.trend .nm{flex:1;min-width:0;font-size:13.5px}
.trend svg{flex:none}
.dorrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;color:var(--tx);box-shadow:var(--card-shadow)}
.dorrow .d{font-family:"IBM Plex Mono";font-size:12px;color:var(--mu)}
.mic{width:44px;height:44px;border-radius:50%;background:var(--p3);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--tx)}
.mic.on{background:var(--neg);border-color:var(--neg);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--negsoft)}}
.partial{font-size:12.5px;color:var(--acc2);font-style:italic;min-height:0}
.hint{font-size:12.5px;color:var(--mu);background:var(--p2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.aiwork{display:flex;gap:8px;align-items:center;color:var(--aitx);font-size:13px}
.spin{width:14px;height:14px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.oslist label{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.oslist input{margin-top:3px;accent-color:var(--neg)}
.preview{background:#fbfaf6;color:#111;border-radius:10px;padding:12px;font:11px/1.45 "IBM Plex Mono",monospace;white-space:pre-wrap;max-height:55vh;overflow:auto;border:1px solid var(--line)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.switch input{width:22px;height:22px;accent-color:var(--acc)}
.tlist button.tr{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);color:var(--tx)}
.lock{font-size:12px;color:var(--pos);font-weight:700}
.warnbox{border:1px solid var(--neg);background:var(--negsoft);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.warnbox li{margin:2px 0}
.okbox{border:1px solid var(--pos);background:var(--possoft);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px;color:var(--pos)}
.prev{font-size:11px;color:var(--dim);font-family:"IBM Plex Mono"}
.ph{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.ph-L{background:#E5C400}.ph-1{background:#E5483D}.ph-2{background:#F39A1C}.ph-3{background:#6FBF3F}
.ck{display:flex;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.ck .t{flex:1;min-width:0;font-size:13.5px}
.ck.l1 .t{padding-left:14px;font-size:13px;color:var(--tx2)}.ck.l2 .t{padding-left:28px;font-size:12.5px;color:var(--mu)}
.ck.hd .t{font-weight:700;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.ckb{width:44px;height:36px;border-radius:8px;background:var(--p2);border:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--dim);line-height:1.1;flex:none}
.ckb.on{background:var(--possoft);border-color:var(--pos);color:var(--pos)}
.ckb small{display:block;font-weight:500;font-size:9.5px}
.bar2{height:7px;border-radius:4px;background:var(--p3);overflow:hidden;display:flex}
.bar2 i{display:block;height:100%}
.secsum{display:flex;gap:10px;align-items:center;width:100%}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:8px}
.tog.on{border-color:var(--hi)}
.tog input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.mini{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 5px;margin-left:4px;background:var(--accsoft);color:var(--acc2)}
.mini.n{background:var(--rlo-bg);color:var(--rlo)}
.tip{font-size:10.5px;letter-spacing:.04em;color:var(--dim);text-align:center;margin:6px 0 12px;line-height:1.6}
.rtprow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--tx)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 label.f{margin-top:4px}
.themepick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.themepick button{border:1.5px solid var(--line);border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--tx);background:var(--p2)}
.themepick button.on{border-color:var(--hi);background:var(--hisoft)}
.themepick .sw{width:100%;height:34px;border-radius:7px;display:flex;overflow:hidden;border:1px solid var(--line)}
.themepick .sw i{flex:1}
</style>
</head>

  <div class="ttl"><b id="hdrName">10-8</b><small id="hdrSub">Field training · FTEP</small></div>

<script>
const SEGS=[{"n": 1, "g": "Critical Performance Tasks", "name": "Driving: Stress", "d": "Evaluates trainee's vehicle operation skills requiring an emergency or other-than-normal driving response. Is the trainee prudent and safe?", "a1": "Involved in crash(es). Unnecessary and/or improper use of lights and siren. Drives too fast or too slow for the situation. Fails to slow for intersections. Loses control in corners. Does not evaluate traffic conditions.", "a4": "Maintains control of vehicle. Evaluates traffic conditions. Reacts properly (example: proper speed for conditions; slows for intersections). Correct use of lights and siren. Generally practices defensive driving.", "a7": "Displays high degree of reflex ability and driving competence. Usually anticipates driving situations in advance and responds accordingly. Consistently practices defensive driving."}, {"n": 2, "g": "Critical Performance Tasks", "name": "Orientation: Stress", "d": "Evaluates the trainee's awareness of their surroundings and their ability to find locations and arrive at destinations within an acceptable period of time under stressful conditions.", "a1": "Unaware of location. Becomes disoriented and/or lost. Unable to relate location to destination. Does not use map or other locator devices. Unable to determine compass direction in tactical situations. Takes too long to arrive at location. Selects inappropriate route to location.", "a4": "Usually aware of location. Is able to relate location to destination. Uses maps and other locator devices correctly. Demonstrates good sense of direction in tactical situations. Takes best route. Arrives within an acceptable period of time.", "a7": "Generally responds quickly to stressful situations by the most acceptable route. Does not need to refer to maps. Rarely disoriented during tactical situations. Usually aware of shortest routes. Remembers locations from previous calls."}, {"n": 3, "g": "Critical Performance Tasks", "name": "Field Performance: Stress", "d": "Evaluates the trainee's ability to function in stressful situations.", "a1": "Becomes emotional, panic stricken, confused, loses temper. Unable to function. Does not engage. Overreacts.", "a4": "Generally exhibits a calm and controlled demeanor. Usually able to keep a situation from further deteriorating. Able to determine proper course of action and takes it.", "a7": "Maintains self-control in extreme situations. Generally able to bring order under any circumstances without assistance. Determines best course of action and takes it."}, {"n": 4, "g": "Critical Performance Tasks", "name": "Officer Safety: General", "d": "Evaluates the trainee's ability to perform tasks without injuring self or exposing others to potential dangers or risks.", "a1": "Fails to follow accepted safety procedures and practices as outlined in the following list. Fails to follow agency-specific safety procedures and practices not included in the following list.", "a4": "Understands the principles of officer safety. Generally applies the principles of officer safety.", "a7": "Always maintains a safe position. Always watchful on the approach to a call and able to do the same for partner. Does not become paranoid or overconfident. Recognizes potentially dangerous situations and prepares for them. Keeps partner informed.", "list": ["Exposes weapon/s (firearm, impact weapon, pepper spray, etc.).", "Fails to keep weapon hand free during enforcement situation.", "Stands in front of violator's vehicle door.", "Fails to control suspect's movements.", "Fails to keep violator/suspect in sight.", "Fails to use illumination when necessary.", "Fails to advise the communication center/dispatch when leaving vehicle.", "Fails to utilize personal safety equipment properly.", "Fails to maintain personal safety equipment properly.", "Does not foresee potentially dangerous situations.", "Points firearm at other officers.", "Stands too close to passing vehicular traffic.", "Stands in front of door when knocking.", "Fails to have weapon ready when appropriate.", "Fails to cover other officers.", "Fails to search police vehicle prior to duty.", "Fails to search police vehicle after transporting.", "Fails to check police vehicle equipment.", "Fails to position vehicle properly on car stops/ answering calls.", "Fails to maintain awareness of the activities of other officers.", "Fails to maintain a zone of safety (bladed stance, reactionary gap).", "Fails to select/utilize cover and/or concealment appropriately."]}, {"n": 5, "g": "Critical Performance Tasks", "name": "Officer Safety: Suspicious Persons & Prisoners", "d": "Evaluates the trainee's ability to perform officer safety principles correctly when dealing with suspicious persons, suspects, and prisoners.", "a1": "Frequently violates the principles of officer safety as outlined in SEG #4. Fails to \"pat-search\". Confronts people while seated in police vehicle. Fails to handcuff when appropriate. Conducts poor searches. Fails to maintain a position of advantage to prevent attack or escape.", "a4": "Understands the principles of officer safety and generally applies them when dealing with suspects, suspicious persons, and prisoners. Generally displays an awareness of potential danger from suspects, suspicious persons, and prisoners. Maintains a position of advantage.", "a7": "Always maintains a position of advantage and is alert to changing conditions. Foresees potentially dangerous situations and prepares for them."}, {"n": 6, "g": "Critical Performance Tasks", "name": "Control of Conflict: Voice", "d": "Evaluates the trainee's ability to gain and maintain control of a situation through verbal skills (commands and instructions).", "a1": "Inappropriate voice inflection (Example: too soft, too loud, confused, indecisive, timid, overbearing, impatient, arrogant). Poor officer bearing. Confuses or angers listeners by what is said or how it is said. Fails to use \"voice skills\" appropriately.", "a4": "Generally speaks with authority. Speaks in a calm, clear voice. Uses appropriate words and voice skills.", "a7": "Is able to control situations utilizing voice and language skills (tone, word selection, inflection) and body language/bearing."}, {"n": 7, "g": "Critical Performance Tasks", "name": "Control of Conflict: Physical", "d": "Evaluates the trainee's ability to gain and maintain control of situations through physical skills.", "a1": "Physically unable to perform the task. Cowardly. Uses too little or too much force for given situation. Does not utilize appropriate technique(s). Does not engage or overreacts.", "a4": "Generally is able to gain and maintain control through the application of the appropriate technique(s).", "a7": "High level of knowledge and ability to use the correct technique(s) as appropriate."}, {"n": 8, "g": "Critical Performance Tasks", "name": "Use of Force", "d": "Evaluates the trainee's ability to properly apply the Force Continuum.", "a1": "Uses too little or too much force for the given situation. Fails to engage. Unable to ID pre-attack cues. Fails to engage. Does not request additional assistance when needed. Entices confrontations or escalates situations inappropriately. Is unable to perform the task.", "a4": "Maintains control using reasonable force. Applies appropriate force by policy. De-escalates force when resistance is overcome. Precedes application of force with appropriate verbalizations.", "a7": "Always prepared to use the appropriate level of force to facilitate control. Adept in the proper use of force for the given situation. Always uses appropriate verbalizations."}, {"n": 9, "g": "Frequent Performance Tasks", "name": "Driving: Non-Stress", "d": "Evaluates the trainee's skill in motor vehicle operation under normal and routine driving conditions. Is the trainee safe and prudent?", "a1": "Violates traffic laws. Involved in avoidable crash(es). Does not multi-task while driving. Fails to maintain control of the vehicle. Speed too fast or slow for conditions.", "a4": "Generally maintains control of the vehicle while being alert to activity outside of the vehicle. Generally practices defensive driving techniques. Usually able to multi-task.", "a7": "Consistently maintains control of the vehicle while exhibiting lawful and courteous driving. Able to multi-task. Practices defensive driving."}, {"n": 10, "g": "Frequent Performance Tasks", "name": "Orientation: Non-Stress", "d": "Evaluates the trainee's awareness of their surroundings and their ability to find locations and arrive at destinations within an acceptable period of time during normal/routine situations.", "a1": "Unaware of location. Becomes disoriented and/or lost. Unable to relate location to destination. Does not use map or other locator devices. Unable to determine compass directions in tactical situation. Takes too long to arrive at location. Selects inappropriate route to location.", "a4": "Usually aware of location. Is able to relate location to destination. Uses maps and other locator devices correctly. Demonstrates good sense of direction in tactical situation. Takes best route. Arrives within an acceptable period of time.", "a7": "Generally responds quickly by the most acceptable route. Does not need to refer to maps. Rarely disoriented. Usually aware of shortest routes. Remembers locations from previous calls."}, {"n": 11, "g": "Frequent Performance Tasks", "name": "Field Performance: Non-Stress", "d": "Evaluates the trainee's ability to do the job under normal working conditions.", "a1": "Becomes emotional (panic-stricken, confused, loses temper, disoriented). Unable to function. Does not engage. Overreacts. Does not complete the call. Takes wrong course of action.", "a4": "Generally exhibits a calm and controlled demeanor. Usually able to keep a situation from further deteriorating. Able to determine the proper course of action and takes it.", "a7": "Maintains self-control in extreme situations. Generally able to bring order without assistance. Able to determine the best course of action and take it."}, {"n": 12, "g": "Frequent Performance Tasks", "name": "Problem Solving / Decision Making", "d": "Evaluates the trainee's performance in terms of ability to identify and resolve problems, perceive accurately and form valid conclusions, and arrive at sound judgments based upon facts available.", "a1": "Is indecisive. Acts without thought. Relies on others to make decisions. Naive. Does not reason through a problem before coming to a conclusion. Does not recall previous solutions and apply them in like situations.", "a4": "Is generally able to reason out problems and make own decisions in routine or normal situations. Makes reasonable decisions based upon available information. Perceives situations as they really are.", "a7": "Able to reason through complex situations. Foresees problems and arrives at advance solutions."}, {"n": 13, "g": "Frequent Performance Tasks", "name": "Self-Initiated Activity", "d": "Evaluates the trainee's interest and ability to recognize and initiate their own work activity.", "a1": "Does not see or avoids activity. Rationalizes suspicious circumstances. Fails to follow up. Handles only radio-dispatched situations. Does not assist others.", "a4": "Frequently recognizes and takes action on non-assigned tasks. Displays inquisitiveness. Readily assists others.", "a7": "Cultivates intelligent sources within the agency. Utilizes information from briefings to make cases. Seldom misses observable activity."}, {"n": 14, "g": "Frequent Performance Tasks", "name": "Patrol Procedures", "d": "Evaluates the trainee's ability to provide effective counter-measures to patrol zone problems.", "a1": "Does not identify patrol zone problems. Does not take corrective action on observed hazards. Does not have a patrol plan. Does not use available resources to assess the extent of patrol zone problems. Does not interact with patrol zone residents and businesses.", "a4": "Frequently identifies patrol zone crime and neighborhood nuisance problems. Takes corrective action on observed problems. Has a patrol plan. Uses available resources to identify and address problems. Interacts with patrol zone residents and businesses.", "a7": "Usually demonstrates a high skill level in identifying crime and nuisance problems. Takes action on observed problems. Utilizes an aggressive patrol plan and interacts with patrol zone residents and businesses to impact crime."}, {"n": 15, "g": "Frequent Performance Tasks", "name": "Investigative Procedures", "d": "Evaluates the trainee's ability to protect the scene, control activities, gather and document information and preserve evidence at a crime scene.", "a1": "Does not protect the scene. Does not connect suspect with evidence when apparent. Makes frequent mistakes when identifying, collecting and submitting evidence. Unable to accurately diagnose offense. Does not conduct a basic investigation. Improperly conducts an investigation. Lacks skill in collecting fingerprints.", "a4": "Is generally accurate in identifying the offense committed. Follows proper investigatory procedures in routine cases. Connects evidence with suspect when apparent. Is able to collect readable fingerprints in routine situations. Correctly identifies, collects and submits evidence.", "a7": "Usually accurate in offense identification. Has a high level of skill in the identification, collection and submission of evidence. Always follows proper procedures. Is able to collect readable fingerprints from many surface types."}, {"n": 16, "g": "Frequent Performance Tasks", "name": "Interview & Interrogation", "d": "Evaluates the trainee's ability to use proper and lawful interview and interrogation skills.", "a1": "Frequently does not issue a Miranda warning appropriately. Does not use proper questioning techniques. Does not elicit and/or record information. Does not establish appropriate rapport. Does not control the interview. Does not follow agency policies.", "a4": "Generally uses proper questioning techniques. Elicits and records information. Establishes proper rapport and controls the interview. Follows procedures. Issues Miranda when appropriate.", "a7": "Always conducts thorough interviews, uses Miranda appropriately, identifies body language cues, uses proper questioning techniques, establishes rapport and controls the interview."}, {"n": 17, "g": "Frequent Performance Tasks", "name": "Technology / Equipment", "d": "Evaluates the trainee's ability to correctly and appropriately use specialized technology and equipment as provided by the agency. Specify the type of equipment when giving DOR ratings and narratives.", "a1": "Frequently makes mistakes. Seldom uses or does not use reference manuals. Frequently requires assistance.", "a4": "Generally able to utilize equipment accurately. Is able to use reference manuals to find answers to questions. Follows correct procedures. Discovers and corrects mistakes.", "a7": "Seldom makes mistakes when using specialized equipment. Seldom needs to refer to manuals."}, {"n": 18, "g": "Frequent Performance Tasks", "name": "Routine Forms", "d": "Evaluates the trainee's ability to select and correctly complete the appropriate form.", "a1": "Frequently unable to select the proper form for the given situation. Turns in incorrect and/or incomplete forms. Requires a high level of assistance. Is unaware a form is required.", "a4": "Generally able to select the appropriate most commonly used forms. Understands the format and completes forms with reasonable accuracy. Seldom needs assistance.", "a7": "Consistently and rapidly completes detailed forms with no assistance. Seldom needs correction."}, {"n": 19, "g": "Frequent Performance Tasks", "name": "Report Writing: Organization/Details", "d": "Evaluates the trainee's ability to prepare an organized and detailed report that accurately reflects a situation.", "a1": "Unable to organize events and reduce them to written form. Does not report information in a logical sequence. Needs frequent assistance.", "a4": "Generally is able to complete reports that organize information in a logical sequence and include all of the necessary elements of the situation. Occasionally needs correction.", "a7": "Usually reports contain a complete and detailed account of what occurred from beginning to end. Reports written and organized so that the reader will understand what occurred. Seldom needs correction."}, {"n": 20, "g": "Frequent Performance Tasks", "name": "Report Writing: Grammar/Neatness/Spelling", "d": "Evaluates the trainee's ability to produce a neat, sequenced, and factual report with correct grammar and spelling.", "a1": "Reports are frequently illegible, contain incomplete sentences, and misspelled words. Requires constant checking.", "a4": "Usually produces reports with correct grammar, spelling, and neatness. Occasionally requires assistance and makes mistakes. Errors, if present, do not impair understanding.", "a7": "Consistently produces reports that are very neat and legible with no spelling mistakes. Excellent grammar."}, {"n": 21, "g": "Frequent Performance Tasks", "name": "Report Writing: Time Used", "d": "Evaluates the trainee's ability to produce a report within an acceptable period of time.", "a1": "Usually requires an excessive amount of time to complete a basic report/form. (Three or more times the amount of time the average tenured officer would take for a similar report.)", "a4": "Usually completes basic reports/forms within a reasonable amount of time. (The time it would take the average tenured officer for a similar report.)", "a7": "Completes basic reports/forms as quickly as a skilled veteran officer."}, {"n": 22, "g": "Frequent Performance Tasks", "name": "Radio: Codes & Procedures", "d": "Evaluates the trainee's ability to correctly understand and apply policy and procedures.", "a1": "Frequently misinterprets code definitions or uses the wrong 10-code and/or phonetic alphabet. Makes frequent mistakes in policy or procedure. Uses incorrect frequencies and/or does not follow proper radio etiquette. Fails to listen prior to transmitting and cuts others off on the radio.", "a4": "Has a good working knowledge of most commonly used codes, frequencies, and radio procedures. Occasionally needs correction. Uses a \"code sheet\" when necessary. Generally follows policy and procedures.", "a7": "Always follows policy and proper procedure. Uses codes/phonetic alphabet with ease. Seldom makes mistakes or needs to be corrected or refer to \"code sheet\"."}, {"n": 23, "g": "Frequent Performance Tasks", "name": "Radio: Hears & Comprehends", "d": "Evaluates the trainee's ability to hear his/her call sign and awareness of radio traffic involving other cars and officers.", "a1": "Frequently misses car/officer call-sign and is unaware of radio traffic in adjoining jurisdictions/areas. Frequently asks for transmissions to be repeated. Frequently begins radio transmissions while another car/unit is speaking.", "a4": "Generally copies radio transmission to him/her and is aware of adjoining jurisdictions/areas radio traffic. Occasionally asks for a transmission to be repeated.", "a7": "Almost always comprehends radio transmissions and is aware of adjoining jurisdictions/areas radio traffic. Seldom asks for a transmission to be repeated. Mostly asks only for radio transmissions to be repeated if the lack of understanding is due to poor radio reception or emergent circumstances that prevents the trainee from hearing the original transmission."}, {"n": 24, "g": "Frequent Performance Tasks", "name": "Radio: Articulation", "d": "Evaluates the trainee's ability to communicate with others via the police radio.", "a1": "Does not preplan transmissions. Volume/tone of transmission is incorrect (i.e. screams when it should be a non-stressful transmission and/or whispers). Frequently mumbles, speaks too quickly or too slowly. Frequently asked to repeat transmissions. Uses microphone incorrectly. Timid. Extends radio transmission to be very lengthy.", "a4": "Generally uses clear, complete, and concise transmission. Is seldom asked to repeat a transmission.", "a7": "Transmits clearly, calmly, concisely, and completely even in stressful situations."}, {"n": 25, "g": "Knowledge", "name": "Policy & Procedure: Field", "d": "Evaluates trainee's knowledge of agency policies and procedures and his/her ability to apply them in the field.", "a1": "Fails to demonstrate knowledge of common agency policies and procedures. Requires frequent correction.", "a4": "Familiar with and applies the most commonly used agency policies and procedures. Requires occasional correction.", "a7": "Familiar with and applies the most commonly used agency policies and procedures. Also familiar with some seldom used policies and procedures. Seldom needs correction."}, {"n": 26, "g": "Knowledge", "name": "Policy & Procedure: Testing", "d": "Evaluates the trainee's knowledge of agency policies and procedures and his/her ability to apply them in the field.", "a1": "Scores lower than 70% on verbal tests, written tests, and simulations.", "a4": "Scores 70% - 90% on verbal tests, written tests, and simulations.", "a7": "Scores above 90% on verbal tests, written tests, and simulations.", "test": 1}, {"n": 27, "g": "Knowledge", "name": "Criminal Statutes: Field", "d": "Evaluates the trainee's knowledge of criminal statutes and his/her ability to apply them in the field.", "a1": "Frequently does not know the elements of the commonly used statutes. Does not recognize criminal offenses. Requires frequent correction.", "a4": "Generally has a working knowledge of the most commonly used statutes and is able to relate elements to observed activity in the field. Can differentiate between criminal and non-criminal activity. Needs occasional correction.", "a7": "Displays outstanding knowledge of statutes and their elements. Is able to apply statutes in common and unusual cases. Seldom needs correction."}, {"n": 28, "g": "Knowledge", "name": "Criminal Statutes: Testing", "d": "Evaluates the trainee's knowledge of criminal statutes and his/her ability to apply them in the field.", "a1": "Scores lower than 70% on verbal tests, written tests, and simulations.", "a4": "Scores 70% - 90% on verbal test, written tests, and simulations.", "a7": "Scores above 90% on verbal tests, written tests, and simulations.", "test": 1}, {"n": 29, "g": "Knowledge", "name": "Resources & Alternatives: Field", "d": "Evaluates the trainee's knowledge of and ability to use referral agencies and other resources to resolve patrol zone problems.", "a1": "Does not know, or does not use, the most common referral agencies.", "a4": "Demonstrates an awareness of the most common referral agencies and uses them appropriately.", "a7": "Demonstrates high level of familiarity with the most common referral agencies. Seeks information on less well-known agencies. Actively works to maintain a network of referral agencies. Actively works to maintain a network of referral agency contacts."}, {"n": 30, "g": "Knowledge", "name": "Resources & Alternatives: Testing", "d": "Evaluates the trainee's knowledge of and ability to use referral agencies and other resources to resolve patrol zone problems.", "a1": "Scores lower than 70% on verbal tests, written tests, and simulations.", "a4": "Scores 70% - 90% on verbal test, written tests, and simulations.", "a7": "Scores above 90% on verbal tests, written tests, and simulations.", "test": 1}, {"n": 31, "g": "Knowledge", "name": "Traffic Statutes: Field", "d": "Evaluates the trainee's knowledge of traffic statutes and his/her ability to apply them in the field.", "a1": "Frequently does not know the elements of the commonly used statutes. Does not recognize violations. Requires frequent correction.", "a4": "Generally has a working knowledge of the most commonly used statutes and is able to identify violations. Needs occasional correction.", "a7": "Displays outstanding knowledge of statutes and their elements. Is able to apply statues in common and unusual cases. Seldom needs correction."}, {"n": 32, "g": "Knowledge", "name": "Traffic Statutes: Testing", "d": "Evaluates the trainee's knowledge of traffic statutes and his/her ability to apply them in the field.", "a1": "Scores lower than 70% on verbal tests, written tests, and simulations.", "a4": "Scores 70% - 90% on verbal test, written tests, and simulations.", "a7": "Scores above 90% on verbal tests, written tests, and simulations.", "test": 1}, {"n": 33, "g": "Knowledge", "name": "Scope of Practice: Field", "d": "Evaluates the trainee's knowledge of his/her scope of practice and his/her ability to apply this knowledge in the field.", "a1": "Frequently does not know his/her scope of practice. Does not recognize scope of practice boundaries and when it is necessary to request a Level III certified officer. Frequently attempts to work beyond scope of practice. Requires frequent correction.", "a4": "Generally has a working knowledge of his/her scope of practice. Generally recognizes his/her scope of practice boundaries and when it is necessary to request a Level III certified officer. Needs occasional correction.", "a7": "Displays outstanding knowledge of his/her scope of practice. Recognizes his/her scope of practice boundaries and when it is necessary to request a Level III certified officer. Does not work beyond scope of practice. Seldom needs correction.", "l2": 1}, {"n": 34, "g": "Knowledge", "name": "Scope of Practice: Testing", "d": "Evaluates the trainee's knowledge of his/her scope of practice and his/her ability to apply this knowledge in the field.", "a1": "Scores lower than 70% on verbal tests, written tests, and simulations.", "a4": "Scores 70% - 90% on verbal test, written tests, and simulations.", "a7": "Scores above 90% on verbal tests, written tests, and simulations.", "test": 1, "l2": 1}, {"n": 35, "g": "Attitude & Relationships", "name": "Acceptance of Feedback: FTO & FTEP", "d": "Evaluates the manner in which the trainee receives and responds to feedback.", "a1": "Rationalizes mistakes. Denies that errors were made. Argumentative. Does not make corrections. Responds to criticism negatively. Avoids feedback.", "a4": "Accepts feedback in a professional and positive manner. Applies it to improve performance and further learning. Frequently seeks feedback.", "a7": "Actively seeks feedback to further learning and improve performance. Does not argue with the FTO. Does not blame other people or things for mistakes."}, {"n": 36, "g": "Attitude & Relationships", "name": "Attitude Toward Job", "d": "Evaluates the trainee's quality of job interest and acceptance of responsibility. Evaluates how appropriately he/she handles issues such as power, authority, and ego.", "a1": "Uses the job to boost ego. Abuses authority. Appears disinterested. Lacks motivation. Resistant to assignments. Belittles the agency.", "a4": "Displays an active interest in learning about the job. Does not abuse authority. Actively developing professional style that incorporates core values and high ethical standards.", "a7": "Utilizes off-duty time to further professional knowledge. Actively solicits assistance to increase knowledge and improve skills. Maintains high ideals toward professional responsibilities."}, {"n": 37, "g": "Attitude & Relationships", "name": "Relationships: Citizens", "d": "Evaluates the trainee's ability to interact with citizens in an appropriate and efficient manner.", "a1": "Does not perform the \"service\" aspect of the job. Abrupt. Belligerent. Uncommunicative. Aggressive \"non-verbal\" skills. Insensitive. OR introverted. Poor \"non-verbal\" skills. Insensitive. Overly sympathetic.", "a4": "Courteous. Friendly. Sympathetic. Communicates in a professional and unbiased manner. Good \"non-verbal\" skills. Service oriented.", "a7": "Establishes rapport easily and is always objective. Appears to be at ease in any person-to-person situation. Excellent \"non-verbal\" skills."}, {"n": 38, "g": "Attitude & Relationships", "name": "Relationships: Supervisors & Co-Workers", "d": "Evaluates the trainee's ability to effectively interact with agency members including the various ranks and assignments.", "a1": "Insubordinate. Antagonistic. Patronizing. Gossips. Argumentative. Sarcastic. Fawns over others. Resists instruction. Considers self-superior. Not a team player. Argues with the FTO or other superior officers. Belittles the FTO or other employees in front of or to others. Does not adhere to the chain of command.", "a4": "Is able to establish a good working relationship with the FTO. Understands and adheres to the chain of command. Respects superior officers and co-workers. Works actively to be accepted as a member of the \"team.\"", "a7": "Always at ease with all agency members and displays appropriate respect and consideration for their position. Peer group leader. Actively assists others."}, {"n": 39, "g": "Attitude & Relationships", "name": "Relationships: Other Groups", "d": "Evaluates the trainee's ability to interact effectively and appropriately with members of ethnic/ cultural/ social groups other than their own.", "a1": "Hostile or too sympathetic. Prejudicial, subjective, and biased. Ineffective. Causes problems for the agency as a result of his/her treatment of group members.", "a4": "Generally at ease with members of other ethnic/cultural /social groups. Uses his/her understanding of these groups to help resolve issues.", "a7": "Always objective and at ease dealing with members of different groups. Uses his/her understanding of these groups to help resolve issues."}, {"n": 40, "g": "Appearance", "name": "General Appearance", "d": "Evaluates the trainee's physical appearance, dress, demeanor and equipment.", "a1": "Soiled and/or wrinkled uniform. Dirty shoes. Uniform does not fit. Uniform improperly worn. Hair, piercing, etc in. violation of agency's personal grooming regulations/policy. Dirty weapon. Dirty equipment. Equipment is missing or inoperative. Offensive body odor and/or breath. Poor presence.", "a4": "Uniform is neat and clean. Uniform fits and is properly worn. Uniform brass is clean and correctly positioned. Weapon passes inspection. Leather clean. Well-groomed hair. Shoes clean. All required equipment is present. Professional bearing.", "a7": "Uniform, weapon, equipment is clean. As appropriate, leather/brass is shined. Highly-shined shoes. Command bearing."}];

<script>
"use strict";
// ================= utils =================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const nowTime=()=>{const d=new Date();return pad(d.getHours())+pad(d.getMinutes())};
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmtDate=s=>{if(!s)return'';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})};
const usDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return `${m}/${d}/${y}`};
const shortDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return `${+m}/${+d}`};
const toast=(m,ms=2200)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),ms)};

const SEGMAP={};SEGS.forEach(s=>SEGMAP[s.n]=s);
const GROUPS=['Critical Performance Tasks','Frequent Performance Tasks','Knowledge','Attitude & Relationships','Appearance'];
const SUBHEAD={25:'Department Policy & Procedure',27:'Criminal Statutes',29:'Resources & Alternatives',31:'Traffic Statutes',33:'Scope of Practice'};
const RATINGS=['1','2','3','4','5','6','7'];
const PHASES=['Phase I','Phase II','Phase III','Remedial'];
const PHASE_RIDES={'Phase I':24,'Phase II':16,'Phase III':16,'Remedial':8};
const PH_LABEL={L:'Limbo',1:'Phase I',2:'Phase II',3:'Phase III'};
const TIPS='SET THE STAGE · USE QUOTES · USE LISTS · INCLUDE REMEDIAL · FRONT = BACK · USE SEGs · REMEMBER YOUR AUDIENCE · DO NOT PREDICT';
const CALLS=['MV stop','Crash','Alarm','Domestic','Welfare check','Suspicious','Theft','Disturbance','Arrest','Mental health','Foot patrol','Assist'];
function rClass(r){if(!r||r==='NO')return'r-no';const n=+r;return n<=2?'r-lo':n===3?'r-mid':n<=5?'r-ok':'r-hi'}
const isNum=r=>/^[1-7]$/.test(r);
function normPhase(p){const m={'Phase 1':'Phase I','Phase 2':'Phase II','Phase 3':'Phase III','Phase 4':'Phase III','Shadow / Eval':'Phase III','Extended':'Remedial'};return PHASES.includes(p)?p:(m[p]||'Phase I')}

// ================= state =================
const LS='fto_fieldbook_v2', LS_OLD='fto_fieldbook_v1', LSD='fto_fieldbook_draft';
let S={profile:null,notes:{},dors:{},rtps:{},checks:{}};
function defaultProfile(){return{fto:{name:'',badge:'',init:''},agency:'Montpelier Police Department',trainees:[],active:null,settings:{carry:true}}}
function ensureProfile(){
  if(!S.profile){S.profile=defaultProfile();return true}
  const p=S.profile;p.trainees=p.trainees||[];p.settings=Object.assign({carry:true},p.settings||{});p.fto=Object.assign({name:'',badge:'',init:''},p.fto||{});
  if(p.agency===undefined||p.agency==='')p.agency='Montpelier Police Department';
  p.trainees.forEach(t=>{t.phase=normPhase(t.phase);t.level=t.level||'II'});
  return false;
}
function normDor(d){
  d.ratings=d.ratings||{};d.comments=d.comments||{};d.nrt=d.nrt||{};d.rem=d.rem||{};d.time=d.time||{};
  d.most=d.most||{cat:null,text:''};d.least=d.least||{cat:null,text:''};d.used=d.used||[];
  for(const k in d.ratings){if(d.ratings[k]==='NRT'){d.ratings[k]='2';d.nrt[k]=true}}
  d.phase=normPhase(d.phase);
  if(d.ride==null)d.ride=d.day||1;
  ['shiftHours','totalHours','nonFto','assignment','traineeComments','narrative','calls','mv','arrests','viols'].forEach(k=>{if(d[k]==null)d[k]=''});
  if(d.shift&&!d.shiftHours)d.shiftHours=d.shift;
  if(d.remedial){d.narrative=(d.narrative?d.narrative+'\n':'')+'Remedial: '+d.remedial+(d.minutes?' ('+d.minutes+' min)':'');d.remedial=''}
  if(d.attach==null)d.attach=false;if(d.radio==null)d.radio=false;
  return d;
}
const P=()=>S.profile;
const T=()=>P()&&P().trainees.find(t=>t.id===P().active);
const TR=id=>P().trainees.find(t=>t.id===id)||{};
const segsFor=t=>SEGS.filter(s=>!(s.l2&&t&&t.level==='III'));
const notesFor=tid=>Object.values(S.notes).filter(n=>n.tid===tid).sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||''))||b.ts-a.ts);
const dorsFor=tid=>Object.values(S.dors).filter(d=>d.tid===tid).sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0));
const rtpsFor=tid=>Object.values(S.rtps).filter(r=>r.tid===tid).sort((a,b)=>b.date.localeCompare(a.date));
function checksFor(tid){if(!S.checks[tid])S.checks[tid]={tid,items:{}};return S.checks[tid]}
function cacheSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function cacheLoad(){try{const j=JSON.parse(localStorage.getItem(LS)||localStorage.getItem(LS_OLD)||'null');if(j&&j.notes){S=Object.assign({profile:null,notes:{},dors:{},rtps:{},checks:{}},j)}}catch(e){}
  Object.values(S.dors).forEach(normDor)}

// ================= persistence =================
let COL=null;
const pending={}, inflight={}, timers={};
function setSync(k,msg){const d=$('#syncDot'),t=$('#syncTx');d.className='dot '+(k==='ok'?'ok':k==='err'?'err':k==='wait'?'wait':'');t.textContent=msg||({ok:'synced',err:'sync error',wait:'saving…',local:'this device'}[k]||k)}
function persist(key,obj){cacheSave();if(!COL)return;pending[key]=obj===null?{__del:1}:clone(obj);flush(key)}
function persistSoon(key,getter,ms=700){cacheSave();clearTimeout(timers[key]);timers[key]=setTimeout(()=>{delete timers[key];const v=getter();if(v!==undefined)persist(key,v)},ms)}
async function flush(key){
  if(inflight[key])return;
  while(key in pending){
    const v=pending[key];delete pending[key];inflight[key]=true;setSync('wait');
    let tries=0;
    for(;;){
      try{v.__del?await COL.doc(key).delete():await COL.doc(key).set(v);setSync('ok');break}
      catch(e){
        if(e&&e.code==='unavailable'&&tries++<1){await sleep(700+Math.random()*900);continue}
        if(e&&e.code==='quota_exceeded')toast('Cloud storage is full — export a backup and delete old notes.',5000);
        if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){COL=null;setSync('local','this device only')}else setSync('err');
        break;
      }
    }
    inflight[key]=false;
  }
}
const busyKey=k=>(k in pending)||inflight[k]||(k in timers);
const saveDor=d=>persist('d_'+d.id,d), saveDorSoon=d=>persistSoon('d_'+d.id,()=>S.dors[d.id]);
const saveProfile=()=>persist('profile',S.profile);
const saveChecks=tid=>persistSoon('c_'+tid,()=>S.checks[tid],500);

let deferredRender=false;
function isTyping(){const a=document.activeElement;return a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['checkbox','file'].includes(a.type)))}
document.addEventListener('focusout',()=>setTimeout(()=>{if(deferredRender&&!isTyping()&&!sheetOpen()){deferredRender=false;render()}},50));

async function initCloud(){
  if(!window.claude||!window.claude.use){setSync('local');return}
  let db=null,user=null;
  try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
  if(!db||!user){setSync('local');return}
  let id=null;try{id=await user.id()}catch(e){}
  if(!id){setSync('local');return}
  COL=db.collection('data/users/'+id);
  setSync('wait','connecting…');
  const slow=setTimeout(()=>setSync('err','offline – saved on device'),10000);
  let first=true;
  COL.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(slow);setSync('ok')}
    const ns={profile:null,notes:{},dors:{},rtps:{},checks:{}};
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;const id=d.id;
      if(id==='profile')ns.profile=clone(v);
      else if(id.startsWith('n_'))ns.notes[v.id]=clone(v);
      else if(id.startsWith('d_'))ns.dors[v.id]=normDor(clone(v));
      else if(id.startsWith('r_'))ns.rtps[v.id]=clone(v);
      else if(id.startsWith('c_'))ns.checks[v.tid]=clone(v)});
    if(snap.empty&&!snap.metadata.fromCache&&first){
      first=false;
      const hasLocal=S.profile&&(S.profile.trainees.length||Object.keys(S.notes).length);
      if(hasLocal){uploadAll();return}
    }
    if(!snap.metadata.fromCache)first=false;
    if(S.profile&&busyKey('profile'))ns.profile=S.profile;
    for(const id in S.notes)if(busyKey('n_'+id))ns.notes[id]=S.notes[id];
    for(const id in S.dors)if(busyKey('d_'+id))ns.dors[id]=S.dors[id];
    for(const id in S.rtps)if(busyKey('r_'+id))ns.rtps[id]=S.rtps[id];
    for(const id in S.checks)if(busyKey('c_'+id))ns.checks[id]=S.checks[id];
    for(const k in pending){if(pending[k].__del){const id=k.slice(2);({n:ns.notes,d:ns.dors,r:ns.rtps})[k[0]]&&delete ({n:ns.notes,d:ns.dors,r:ns.rtps})[k[0]][id]}}
    S=ns;
    const created=ensureProfile();
    if(created&&!snap.metadata.fromCache)saveProfile();
    cacheSave();
    if(isTyping()||sheetOpen())deferredRender=true;else render();
  },()=>{clearTimeout(slow);setSync('err','offline – saved on device')});
}
function uploadAll(){
  persist('profile',S.profile);
  Object.values(S.notes).forEach(n=>persist('n_'+n.id,n));
  Object.values(S.dors).forEach(d=>persist('d_'+d.id,d));
  Object.values(S.rtps).forEach(r=>persist('r_'+r.id,r));
  Object.values(S.checks).forEach(c=>persist('c_'+c.tid,c));
}

// ================= optional capabilities =================
let DICT=null, SAMPLE=null, DL=null, dictTarget=null, dictState='idle';
function initCaps(){
  if(!window.claude||!window.claude.use)return;
  claude.use('dictation').then(d=>{if(!d)return;DICT=d;
    d.onFinal(({text})=>{const el=document.getElementById(dictTarget);if(el&&text){el.value=(el.value&&!/\s$/.test(el.value)?el.value+' ':el.value)+text.trim();el.dispatchEvent(new Event('input',{bubbles:true}))}const p=$('#partial');if(p)p.textContent=''});
    d.onPartial(({text})=>{const p=$('#partial');if(p)p.textContent=text||''});
    d.onState(({state})=>{dictState=state;document.querySelectorAll('.mic').forEach(m=>m.classList.toggle('on',state==='listening'))});
    if(!sheetOpen()&&!isTyping())render()}).catch(()=>{});
  claude.use('sample').then(s=>{if(s){SAMPLE=s;if(!sheetOpen()&&!isTyping())render()}}).catch(()=>{});
  claude.use('downloads').then(d=>{if(d)DL=d}).catch(()=>{});
}
const micBtn=target=>DICT?`<button class="mic${dictState==='listening'&&dictTarget===target?' on':''}" data-act="mic" data-t="${target}" aria-label="Dictate"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg></button>`:'';

// ================= phase / ride logic =================
function nextRide(tid,phase,date){return dorsFor(tid).filter(d=>d.phase===phase&&d.date<=date).length+1}
function rideLabel(phase,ride){const wk=Math.ceil(ride/4);const max=PHASE_RIDES[phase]||16;return `${phase} · Ride ${ride}/${max} · Wk ${wk}${phase==='Phase I'&&ride<=8?' (Limbo)':''}`}
function rtpCompleted(tid,cat,date){return Object.values(S.rtps).filter(r=>r.tid===tid&&r.cat==cat&&r.completed===true&&(!date||r.date<=date)).length}
function rtpCount(tid,cat){return Object.values(S.rtps).filter(r=>r.tid===tid&&r.cat==cat).length}
const failing=d=>Object.values(d.ratings).some(r=>isNum(r)&&+r<4);

// ================= UI state =================
let view='notes', curDor=null, curRtp=null, noteFilter={cat:null,day:'all'}, taskFilter='due', taskQ='', openSecs={};
let draft={text:'',tone:'0',cat:null,call:'',caseNo:'',date:today(),time:'',rem:''};
try{Object.assign(draft,JSON.parse(localStorage.getItem(LSD)||'{}'));if(draft.date<today()&&!draft.text)draft.date=today()}catch(e){}
const saveDraft=()=>{try{localStorage.setItem(LSD,JSON.stringify(draft))}catch(e){}};
function recentCats(){
  const t=T();if(!t)return[];const c={};notesFor(t.id).slice(0,80).forEach(n=>{if(n.cat)c[n.cat]=(c[n.cat]||0)+1});
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(e=>+e[0]);
  [4,11,22,19,12,37,5,9,35].forEach(n=>{if(!top.includes(n))top.push(n)});
  return top.slice(0,9);
}

// ================= render =================
function header(){

// ---------------- DOR build ----------------
const prevDor=(tid,date)=>dorsFor(tid).filter(d=>d.date<date).pop();
function noteLine(n){return `${n.call?n.call+(n.caseNo?' #'+n.caseNo:'')+' – ':n.caseNo?'#'+n.caseNo+' – ':''}${n.text}${n.rem?` [remedial ${n.rem} min]`:''}`.trim()}
function buildDor(date){
  const t=T();
  const exist=dorsFor(t.id).find(d=>d.date===date);if(exist)return exist;
  const prev=prevDor(t.id,date);
  const d=normDor({id:uid(),tid:t.id,date,status:'draft',phase:t.phase,ride:nextRide(t.id,t.phase,date),shiftHours:t.shift||'',totalHours:'',fto:P().fto.name,created:Date.now()});
  segsFor(t).forEach(s=>{d.ratings[s.n]=(P().settings.carry&&prev&&isNum(prev.ratings[s.n]))?prev.ratings[s.n]:'NO'});
  pullNotes(d);
  S.dors[d.id]=d;saveDor(d);
  return d;
}
function pullNotes(d){
  const ns=notesFor(d.tid).filter(n=>n.date===d.date&&!d.used.includes(n.id)).reverse();
  const pos={},neg={};
  ns.forEach(n=>{
    d.used.push(n.id);
    if(n.cat){const k=n.cat;d.comments[k]=(d.comments[k]?d.comments[k]+'\n':'')+noteLine(n);
      if(!isNum(d.ratings[k]))d.ratings[k]=n.tone==='-'?'3':'4';
      if(n.rem){d.rem[k]=true;d.time[k]=String((+d.time[k]||0)+(+n.rem||0))}
      if(n.tone==='+')(pos[k]=pos[k]||[]).push(n);if(n.tone==='-')(neg[k]=neg[k]||[]).push(n)}
    else d.narrative=(d.narrative?d.narrative+'\n':'')+noteLine(n);
  });
  const top=o=>Object.entries(o).sort((a,b)=>b[1].length-a[1].length)[0];
  const p=top(pos),q=top(neg);
  if(p&&!d.most.cat)d.most={cat:+p[0],text:p[1].map(noteLine).join(' ')};
  if(q&&!d.least.cat)d.least={cat:+q[0],text:q[1].map(noteLine).join(' ')};
  // shift data from tagged calls
  const day=notesFor(d.tid).filter(n=>n.date===d.date);
  const callKeys=new Set(day.filter(n=>n.call||n.caseNo).map(n=>n.caseNo||n.call+'@'+n.time));
  const mvKeys=new Set(day.filter(n=>/mv|stop|traffic/i.test(n.call||'')).map(n=>n.caseNo||n.time));
  const arr=new Set(day.filter(n=>/arrest/i.test(n.call||'')).map(n=>n.caseNo||n.time));
  if(!d.calls&&callKeys.size)d.calls=String(callKeys.size);
  if(!d.mv&&mvKeys.size)d.mv=String(mvKeys.size);
  if(!d.arrests&&arr.size)d.arrests=String(arr.size);
  return ns.length;
}
function validate(d){
  const err=[],warn=[];const t=TR(d.tid);
  segsFor(t).forEach(s=>{const n=s.n,r=d.ratings[n],c=(d.comments[n]||'').trim();
    const need=['1','2','6','7'].includes(r)||d.rem[n]||d.nrt[n];
    if(need&&!c)err.push(`#${n} ${s.name}: ${d.nrt[n]?'NRT':d.rem[n]?'REM':'rated '+r} needs narrative`);
    if(d.nrt[n]){const k=rtpCompleted(d.tid,n,d.date);if(k<3)err.push(`#${n}: NRT needs 3 completed RTPs in this SEG (${k} logged)`);if(!['1','2'].includes(r))warn.push(`#${n}: NRT score should be a 1 or 2`)}
    if(d.rem[n]&&!d.time[n])warn.push(`#${n}: REM checked — add TIME (minutes)`);
  });
  if(!d.most.cat||!(d.most.text||'').trim())err.push('Most acceptable area + specific incident is mandatory');
  const f=failing(d);
  if(f&&(!d.least.cat||!(d.least.text||'').trim()))err.push('A failing grade was given: least acceptable area + incident is mandatory');
  if(!f&&(d.least.cat||(d.least.text||'').trim()))warn.push('All ratings are passing: least acceptable should be left blank');
  if(!d.totalHours)warn.push('Total hours worked is blank');
  return {err,warn};
}

function spark(vals,nrts){
  const w=96,h=26;const xs=i=>vals.length<2?w/2:i*(w/(vals.length-1));const y=v=>h-2-((v-1)/6)*(h-4);
  const pts=vals.map((v,i)=>[xs(i),v]).filter(p=>typeof p[1]==='number');
  if(!pts.length)return `<svg width="${w}" height="${h}"></svg>`;
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${y(4)}" y2="${y(4)}" style="stroke:var(--sp-axis)" stroke-dasharray="2 3"/><path d="${path}" fill="none" style="stroke:${last[1]<4?'var(--neg)':'var(--sp-mid)'}" stroke-width="1.8" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${y(p[1])}" r="1.8" style="fill:${p[1]<4?'var(--neg)':p[1]>5?'var(--pos)':'var(--sp-dot)'}"/>`).join('')}${nrts.map((v,i)=>v?`<circle cx="${xs(i)}" cy="${h-3}" r="2.6" fill="none" style="stroke:var(--neg)"/>`:'').join('')}</svg>`;
}
let weekSel=null;
function weeksFor(tid){const w={};dorsFor(tid).forEach(d=>{const k=d.phase+'|'+Math.ceil((+d.ride||1)/4);(w[k]=w[k]||[]).push(d)});return w}
function weekText(t,ds){
  const sum=k=>ds.reduce((a,d)=>a+(+d[k]||0),0);const mins={};let rem=[];
  ds.forEach(d=>{for(const n in d.rem)if(d.rem[n]){mins[n]=(mins[n]||0)+(+d.time[n]||0);rem.push(`${shortDate(d.date)} #${n} ${SEGMAP[n].name}${d.time[n]?' ('+d.time[n]+' min)':''}`)}});
  const L=[`FTEP SUPERVISOR WEEKLY REPORT — DATA`,`Recruit officer: ${t.name}${t.badge?' #'+t.badge:''}`,`Training week: ${ds[0].phase}, week ${Math.ceil((+ds[0].ride||1)/4)} · ${usDate(ds[0].date)} to ${usDate(ds[ds.length-1].date)} · ${ds.length} DORs`,``,
  `REMEDIAL TRAINING:`,...(rem.length?rem:['None this week']),``,`MOST ACCEPTABLE:`,...ds.map(d=>`${shortDate(d.date)}: ${d.most.cat?'#'+d.most.cat+' '+SEGMAP[d.most.cat].name:'—'}`),``,`LEAST ACCEPTABLE:`,...ds.map(d=>`${shortDate(d.date)}: ${d.least.cat?'#'+d.least.cat+' '+SEGMAP[d.least.cat].name:'— (all passing)'}`),``,

  `STATS:`,`Calls for Service: ${sum('calls')}`,`MV Stops: ${sum('mv')}`,`Arrests: ${sum('arrests')}`,`Violations: ${sum('viols')}`];
  return L.join('\n');

function vTrends(){
  const t=T();const ds=dorsFor(t.id);const ns=notesFor(t.id);

    const nums=vals.filter(v=>v!==null);const last=nums.slice(-3);const avg3=last.length?last.reduce((a,b)=>a+b,0)/last.length:null;

  </div>

  <div id="sumOut"></div>

function dorFieldValues(d){

  v[0]=String(d.ride||'');v[1]=usDate(d.date);v[2]=d.shiftHours||'';v[3]=d.totalHours||'';v[4]=(t.name||'')+(t.badge?' #'+t.badge:'');v[5]=d.fto||'';v[6]=d.nonFto||'';

  for(let n=1;n<=40;n++){const b=10+(n-1)*12;for(let c=0;c<12;c++)v[b+c]='';
    if(t.level==='III'&&SEGMAP[n].l2)continue;
    const r=d.ratings[n];if(isNum(r))v[b+(+r-1)]='X';else v[b+7]='X';
    if((d.comments[n]||'').trim()&&(isNum(r)||d.rem[n]||d.nrt[n]))v[b+8]='X';
    if(d.nrt[n])v[b+9]='X';if(d.rem[n])v[b+10]='X';if(d.time[n])v[b+11]=String(d.time[n]);}
  v[490]=d.most.cat?String(d.most.cat):'';v[491]=d.most.text||'';v[492]=d.least.cat?String(d.least.cat):'';v[493]=d.least.text||'';

  v[526]=d.traineeComments||'';v[527]=!!d.radio;v[528]=!d.radio;v[529]=String(d.calls||'');v[530]=String(d.mv||'');v[531]=String(d.arrests||'');v[532]=String(d.viols||'');
  return {v,overflow:over?rows.slice(15):[]};
}
function xmlEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fillFormFields(doc,values){
  const starts=[];let i=-1;while((i=doc.indexOf('<w:ffData>',i+1))!==-1)starts.push(i);
  for(let k=starts.length-1;k>=0;k--){
    const v=values[k];if(v===undefined||v===null)continue;
    const s=starts[k];const ffEnd=doc.indexOf('</w:ffData>',s);const ff=doc.slice(s,ffEnd);
    if(ff.includes('<w:checkBox')){let nf=ff.replace(/<w:checked[^>]*\/>/,'').replace(/<w:default w:val="[01]"\/>/,'<w:default w:val="'+(v?1:0)+'"/>'+(v?'<w:checked/>':''));doc=doc.slice(0,s)+nf+doc.slice(ffEnd);continue}
    const sep=doc.indexOf('w:fldCharType="separate"',s);const A=doc.indexOf('</w:r>',sep)+6;
    const endc=doc.indexOf('w:fldCharType="end"',s);const B=Math.max(doc.lastIndexOf('<w:r>',endc),doc.lastIndexOf('<w:r ',endc));
    let rPr=(doc.slice(A,B).match(/<w:rPr>.*?<\/w:rPr>/)||[''])[0];
    if(!rPr){const begR=Math.max(doc.lastIndexOf('<w:r>',s),doc.lastIndexOf('<w:r ',s));const m=doc.slice(begR,s).match(/<w:rPr>.*?<\/w:rPr>/);rPr=m?m[0]:''}
    const body=String(v).split('\n').map((l,j)=>(j?'<w:br/>':'')+'<w:t xml:space="preserve">'+xmlEsc(l)+'</w:t>').join('');
    doc=doc.slice(0,A)+'<w:r>'+rPr+body+'</w:r>'+doc.slice(B);
  }
  return doc;
}
function appendOverflow(doc,rows,d){
  if(!rows.length)return doc;
  const p=(txt,b)=>`<w:p><w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${b?'<w:b/>':''}<w:sz w:val="20"/></w:rPr>${String(txt).split('\n').map((l,j)=>(j?'<w:br/>':'')+'<w:t xml:space="preserve">'+xmlEsc(l)+'</w:t>').join('')}</w:r></w:p>`;
  const t=TR(d.tid);
  let x=`<w:p><w:r><w:br w:type="page"/></w:r></w:p>`+p(`ADDITIONAL NARRATIVE — DOR # ${d.ride} — ${t.name||''} — ${usDate(d.date)}`,true)+p('');
  rows.forEach(r=>{x+=p(r.cat?`Category #${r.cat} – ${SEGMAP[r.cat].name.toUpperCase()}`:'General',true)+p(r.text)+p('')});
  const at=doc.lastIndexOf('<w:sectPr');return doc.slice(0,at)+x+doc.slice(at);
}
async function makeDocx(d){
  await loadScript('js/vendor/jszip.min.js');

const PROGRAM=t=>`the ${P().agency||'police department'} Field Training & Evaluation Program (Vermont Criminal Justice Council, Level ${t.level} officer)`;
async function aiDraft(){
  const d=S.dors[curDor];const t=TR(d.tid);
  const ns=notesFor(d.tid).filter(n=>n.date===d.date).reverse();
  if(!ns.length){toast('No notes on this date to draft from');return}
  const btn=$('#aiBtn');btn.disabled=true;$('#aiStatus').innerHTML='<div class="aiwork" style="margin-top:8px"><span class="spin"></span>Reading notes against the SEGs…</div>';
  const prev=prevDor(d.tid,d.date);
  const prompt=`You help a Field Training Officer complete a Daily Observation Report (FTEP-1 DOR) for ${PROGRAM(t)}.
Rating scale: 1 totally unacceptable; 2 a little better than 1; 3 close to 4 but not yet minimally acceptable; 4 minimum acceptable, able to work solo in a safe, skillful, productive and professional manner; 5-6 above acceptable; 7 superior; "NO" not observed.
Narrative documentation is REQUIRED for ratings of 1, 2, 6, 7 and any remedial training (REM). Never assign NRT.
DOR writing standards: SET THE STAGE, USE QUOTES (only quotes present in the notes), USE LISTS, INCLUDE REMEDIAL, FRONT = BACK (ratings must match the narrative), USE SEG language, REMEMBER YOUR AUDIENCE (supervisor, trainee, possibly a review board), DO NOT PREDICT future performance.
Standardized Evaluation Guidelines (category: description | 1 | 4 | 7):
${segBrief(t)}

Trainee: ${t.name}. ${d.phase}, DOR #${d.ride}${d.phase==='Phase I'&&d.ride<=8?' (limbo/orientation weeks)':''}.
${prev?'Previous DOR ratings: '+JSON.stringify(prev.ratings):'This is the first DOR.'}
Current draft ratings: ${JSON.stringify(d.ratings)}

FTO field notes for ${d.date} (tone: + did well, - needs work, 0 observed; "rem" = remedial training minutes the FTO logged):
${ns.map(n=>`[${n.time||'--'}] tone ${n.tone} | SEG ${n.cat||'untagged'} | ${n.call||''} ${n.caseNo?'#'+n.caseNo:''} | rem ${n.rem||0} | ${n.text}`).join('\n')}

Task: For each SEG the notes give evidence for (assign untagged notes to the best-fitting SEG; one note may support several), suggest a rating anchored to the SEG language and write the narrative: objective, behaviour-based, past tense, third person (call the trainee "Trainee" plus their last name), cite call type/case #, state what was corrected and how the trainee responded when the notes say so. Never invent facts. Ratings of 1, 2, 6, 7 must be justified by specific behaviour. Only report remedial minutes ("rem") for SEGs where the notes explicitly record remedial training. Pick the most acceptable area (SEG # + specific incident). Give a least acceptable area ONLY if one of your ratings is below 4; otherwise return null for it. Put any general observations that fit no SEG in "narrative".
Return ONLY JSON: {"ratings":{"<seg#>":"1".."7"|"NO"},"comments":{"<seg#>":"..."},"rem":{"<seg#>":<minutes>},"most":{"cat":<seg#>,"text":"..."},"least":{"cat":<seg#>,"text":"..."}|null,"narrative":"..."}`;
  try{
    const out=await SAMPLE.json(prompt,{modelTier:'complex'});
    const valid=new Set(segsFor(t).map(s=>String(s.n)));const okR=new Set([...RATINGS,'NO']);
    d.aiCats=[];
    for(const [k,v] of Object.entries(out.ratings||{}))if(valid.has(String(k))&&okR.has(String(v))){d.ratings[k]=String(v);d.aiCats.push(+k)}
    for(const [k,v] of Object.entries(out.comments||{}))if(valid.has(String(k))&&v)d.comments[k]=String(v);
    for(const [k,v] of Object.entries(out.rem||{}))if(valid.has(String(k))&&+v>0){d.rem[k]=true;d.time[k]=String(Math.round(+v))}
    if(out.most&&valid.has(String(out.most.cat)))d.most={cat:+out.most.cat,text:String(out.most.text||'')};
    if(out.least&&valid.has(String(out.least.cat)))d.least={cat:+out.least.cat,text:String(out.least.text||'')};else if(!failing(d))d.least={cat:null,text:''};
    if(out.narrative)d.narrative=String(out.narrative);
    d.ai=true;ns.forEach(n=>{if(!d.used.includes(n.id))d.used.push(n.id)});
    saveDor(d);render();toast(`Claude drafted ${d.aiCats.length} SEGs — check each ✦`,3500);
  }catch(e){
    if(e&&e.code==='not_granted'){SAMPLE=null;render();return}
    $('#aiStatus').innerHTML=`<div class="small" style="color:var(--neg);margin-top:8px">${e&&e.code==='rate_limited'?'Busy — try again in a minute.':'Couldn’t draft this time. Your DOR is unchanged.'}</div>`;btn.disabled=false;
  }
}

  const ask=kind==='week'?`Write the "COMMENTS REGARDING STRENGTHS, WEAKNESSES AND PROGRESS" section of the FTEP Supervisor Weekly Report: overall performance measured by the SEGs, specific strengths and weaknesses with examples, whether progress is increasing, decreasing or unchanged, and remedial training provided with its effect and any further training needed. Under 250 words.`
  :`Write a Phase Evaluation Form summary for ${t.phase}: 1) strengths with specific examples; 2) weaknesses with specific examples; 3) where remedial training was given or special testing done, a brief description of the process and result; 4) recommendations for follow-up training for the next FTO/phase; 5) a clear statement of whether the trainee IS or IS NOT currently performing at the level of a solo patrol officer, based only on the record. Under 400 words.`;
  const prompt=`You help a Field Training Officer in ${PROGRAM(t)}. Trainee: ${t.name}, currently ${t.phase}.

${ask}

  if(el.dataset.set){P().settings[el.dataset.set]=el.checked;saveProfile();return}
  if(el.dataset.dorchk){const d=S.dors[curDor];d[el.dataset.dorchk]=el.checked;saveDor(d);return}
  if(el.dataset.dor&&el.tagName==='SELECT'){const d=S.dors[curDor];if(el.dataset.dor==='phase'){d.ride=dorsFor(d.tid).filter(x=>x.phase===d.phase&&x.date<d.date&&x.id!==d.id).length+1;saveDor(d)}render();return}
  if(el.dataset.rtp==='cat'){render();return}
  if(el.id==='weekSel'){weekSel=el.value;render();return}
  if(el.id==='importFile'&&el.files[0]){const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j.notes||!j.profile)throw 0;
    confirmSheet(`Import ${Object.keys(j.notes).length} notes and ${Object.keys(j.dors||{}).length} DORs? This merges with what's here.`,'Import',()=>{
      const p=S.profile;(j.profile.trainees||[]).forEach(t=>{if(!p.trainees.find(x=>x.id===t.id))p.trainees.push(t)});if(!p.active)p.active=j.profile.active;if(!p.fto.name&&j.profile.fto)p.fto=Object.assign(p.fto,j.profile.fto);ensureProfile();
      Object.assign(S.notes,j.notes);Object.values(j.dors||{}).forEach(d=>S.dors[d.id]=normDor(d));Object.assign(S.rtps,j.rtps||{});Object.assign(S.checks,j.checks||{});uploadAll();cacheSave();render();toast('Imported')})}catch(_){toast('That file isn’t a 10-8 backup')}};rd.readAsText(el.files[0]);el.value=''}
});

// ================= boot =================
applyTheme();cacheLoad();ensureProfile();render();setSync('local');
initCloud();initCaps();
</script>
</body>
